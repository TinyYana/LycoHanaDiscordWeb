<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>彼岸花社群分享圖</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #202024;
        color: #f7f7f7;
        font-family:
          'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui,
          sans-serif;
      }
      main {
        padding: 60px 68px;
        position: relative;
        height: 100%;
      }
      h1 {
        margin: 0;
        font-size: 144px;
        line-height: 1.35;
        letter-spacing: 1px;
        font-weight: 800;
      }
      h1 > span {
        color: #f0445c;
      }
      p {
        max-width: 650px;
        margin: 48px 0 0;
        font-size: 27px;
        line-height: 1.9;
        color: #d0d0d7;
      }
      .address {
        margin-top: 42px;
        font:
          19px Arial,
          sans-serif;
      }
      img {
        position: absolute;
        width: 245px;
        height: 245px;
        right: 65px;
        bottom: 65px;
        transform: rotate(12deg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span>彼岸花</span>社群</h1>
      <p>
        聊 ACG、分享日常的繁中 Discord 小社群<br />偶爾冒泡，想到再回來都可以
      </p>
      <div class="address">discord.tinyyana.com</div>
      <img src="../public/images/lycoris.svg" alt="" />
    </main>
  </body>
</html>
